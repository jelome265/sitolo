[[rules]]
crate = "sitolo-config"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

# --- application layer -------------------------------------------------------
# Use cases, authorization orchestration and business decisions live here.
# Persistence and driver types must arrive through application-owned ports;
# importing the concrete PostgreSQL adapter reverses the dependency direction.

[[rules]]
crate = "sitolo-application"
role = "application"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-api",
]
forbidden_source_tokens = [
  "sqlx_core::", "sqlx_postgres::", "sqlx::", "sitolo_persistence::",
  "PgPool", "PgConnection", "Transaction<'_, Postgres>",
]

# --- transport layer ---------------------------------------------------------
# HTTP application surface. It may call application use cases, but it must not
# reach around them into the database adapter.

[[rules]]
crate = "sitolo-api"
role = "transport"
forbidden_dependencies = [
  "sqlx", "sqlx-core", "sqlx-postgres", "tokio-postgres", "redis",
  "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence",
]

# --- adapters ----------------------------------------------------------------

[[rules]]
crate = "sitolo-persistence"
role = "persistence"
# An adapter depends on the crate that owns the port it implements, so
# `sitolo-application` is deliberately allowed here. What is forbidden is the
# reverse edge: application must never import this crate.
forbidden_dependencies = ["axum", "sitolo-api"]

[[rules]]
crate = "sitolo-integrations"
role = "integration"
forbidden_dependencies = ["axum", "sitolo-api", "sitolo-application", "sitolo-persistence"]

# --- composition roots -------------------------------------------------------
# Runtime composition is the only place allowed to wire every layer together.

[[rules]]
crate = "sitolo-api-bin"
role = "composition"
forbidden_dependencies = []

[[rules]]
crate = "sitolo-worker-bin"
role = "composition"
forbidden_dependencies = []

# --- tooling -----------------------------------------------------------------

[[rules]]
crate = "sitolo-sync"
role = "tooling"
forbidden_dependencies = ["axum", "sitolo-api", "sitolo-application"]

[[rules]]
crate = "sitolo-testkit"
role = "tooling"
forbidden_dependencies = ["axum", "sitolo-api"]
