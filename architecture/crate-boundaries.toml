version = 1
dev_only_dependencies = ["sitolo-testkit"]

# Hard layer boundaries, not advisory targets.
#
# Every workspace package must appear exactly once. `scripts/ci/check-crate-boundaries.py`
# fails closed when a package has no rule (unclassified crate), when a rule names a
# package that no longer exists (stale rule), or when a declared production
# dependency edge crosses a forbidden boundary.
#
# `forbidden_dependencies` are matched against direct *normal* dependencies from
# `cargo metadata`; dev- and build-dependencies are out of scope. The source scan
# (`forbidden_source_tokens`) is a supplementary guard: it catches infrastructure
# types reached through a re-export, which a manifest check cannot see.

# --- domain and pure policy layers -------------------------------------------

[[rules]]
crate = "sitolo-domain"
role = "domain"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

[[rules]]
crate = "sitolo-authz"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

[[rules]]
crate = "sitolo-tenancy"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

[[rules]]
crate = "sitolo-auth"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

[[rules]]
crate = "sitolo-security"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

[[rules]]
crate = "sitolo-events"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

[[rules]]
crate = "sitolo-audit"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
]

[[rules]]
crate = "sitolo-observability"
role = "pure"
forbidden_dependencies = [
  "axum", "sqlx", "sqlx-core", "sqlx-postgres", "redis", "reqwest", "hyper",
  "tokio-postgres", "aws-config", "aws-sdk-sns", "aws-sdk-sqs",
  "sitolo-persistence", "sitolo-application", "sitolo-api",
