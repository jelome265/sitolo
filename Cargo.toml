[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "crates/sitolo-api",
    "crates/sitolo-application",
    "crates/sitolo-audit",
    "crates/sitolo-auth",
    "crates/sitolo-authz",
    "crates/sitolo-config",
    "crates/sitolo-domain",
    "crates/sitolo-events",
    "crates/sitolo-integrations",
    "crates/sitolo-observability",
    "crates/sitolo-persistence",
    "crates/sitolo-security",
    "crates/sitolo-sync",
    "crates/sitolo-tenancy",
    "crates/sitolo-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = { version = "0.1.83", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false }
sha2 = { version = "0.11", default-features = false }
tracing = { version = "0.1", default-features = false }
sitolo-security = { path = "crates/sitolo-security" }

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "thin"
debug = "line-tables-only"
