[workspace]
resolver = "2"
members = [
    "apps/api",
    "apps/worker",
    "crates/sitolo-api",
    "crates/sitolo-application",
    "crates/sitolo-audit",
    "crates/sitolo-auth",
    "crates/sitolo-authz",
    "crates/sitolo-config",
    "crates/sitolo-domain",
    "crates/sitolo-events",
    "crates/sitolo-integrations",
    "crates/sitolo-observability",
    "crates/sitolo-persistence",
    "crates/sitolo-security",
    "crates/sitolo-sync",
    "crates/sitolo-tenancy",
    "crates/sitolo-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"

[workspace.dependencies]
aws-config = { version = "1.13.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.119.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
async-trait = { version = "0.1.83", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "native-tokio", "tls12"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
serde_urlencoded = "0.7"
url = "2"
sha2 = { version = "0.11", default-features = false }
# PostgreSQL-only SQLx crates. The `sqlx` meta-crate and `sqlx-macros` retain
# optional MySQL packages in Cargo.lock even when those features are disabled;
# depending on the backend crates directly removes that unused lockfile surface.
# `_rt-tokio` is the runtime feature the SQLx meta-crate enables for Tokio.
sqlx-core = { version = "0.8", default-features = false, features = ["_rt-tokio"] }
sqlx-postgres = { version = "0.8", default-features = false, features = ["chrono", "json"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tower = { version = "0.5.3", default-features = false, features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["limit", "timeout"] }
# `std` is required for dispatcher installation (`with_default` in tests)
# and subscriber timestamp/thread metadata. Every workspace crate is
# std-only, so this is not a no-std regression.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
sitolo-security = { path = "crates/sitolo-security" }
sitolo-auth = { path = "crates/sitolo-auth" }
sitolo-audit = { path = "crates/sitolo-audit" }
sitolo-domain = { path = "crates/sitolo-domain" }
sitolo-events = { path = "crates/sitolo-events" }
sitolo-observability = { path = "crates/sitolo-observability" }
sitolo-persistence = { path = "crates/sitolo-persistence" }
sitolo-config = { path = "crates/sitolo-config" }

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "thin"
debug = "line-tables-only"
