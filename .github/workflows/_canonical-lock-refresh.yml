name: _canonical-lock-refresh
on:
  push:
    branches: [feat/threat-model-axum-reconciliation-20260926]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Generate canonical lockfile
        run: cargo generate-lockfile
      - name: Commit canonical lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'chore: regenerate Cargo.lock from workspace manifests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
