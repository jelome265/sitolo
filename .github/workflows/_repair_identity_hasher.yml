name: _repair identity hasher

on:
  push:
    branches: [hardening/phase4-part5-enterprise-remediation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.head_commit.message != 'fix(identity): restore PasswordHasher dependency'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1
        with:
          ref: hardening/phase4-part5-enterprise-remediation
          fetch-depth: 1
      - name: Restore required dependency field
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/sitolo-application/src/identity.rs')
          s = p.read_text()
          anchor = 'pub struct IdentityService {\n    db: Arc<IdentityDatabase>,\n'
          field = '    hasher: Arc<dyn PasswordHasher>,\n'
          if s.count(anchor) != 1 or field in s:
              raise SystemExit('identity field precondition failed')
          p.write_text(s.replace(anchor, anchor + field, 1))
          PY
          git diff --check
          git diff -- crates/sitolo-application/src/identity.rs
      - name: Commit source fix and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/sitolo-application/src/identity.rs
          git rm .github/workflows/_repair_identity_hasher.yml
          git commit -m 'fix(identity): restore PasswordHasher dependency'
          git push origin HEAD:hardening/phase4-part5-enterprise-remediation
