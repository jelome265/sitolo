name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Security governance and architecture gates
        run: |
          bash scripts/ci/check-security-icm-policy
          bash scripts/ci/check-threat-model-integrity
          bash scripts/ci/check-api-architecture
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dependency, license, and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Advisory scan
        run: cargo audit

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: rust
      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  offensive-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sitolo_offensive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Run authorized offensive security regression suite
        env:
          SITOLO_OFFENSIVE_ALLOWED: true
          SITOLO_OFFENSIVE_ENV: disposable
          ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/sitolo_offensive
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/sitolo_offensive
          RUNTIME_DATABASE_URL: postgres://app_runtime@127.0.0.1:5432/sitolo_offensive
        run: bash ./scripts/ci/run-offensive-security 2>&1 | tee offensive-security.log
      - name: Publish offensive security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offensive-security-evidence
          if-no-files-found: error
          path: |
            offensive-security.log
            target/offensive-security/run.json

  zz_diag_pr68:
    # TEMPORARY (PR-68 remediation): reproduces the failing steps of
    # security/dependency-policy and rust/verify and prints each step's output
    # as annotations, because raw job logs are unreachable from the authoring
    # environment. Remove before merge.
    name: zz-diag-pr68
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sitolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_TERM_COLOR: never
      ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/sitolo_test
      RUNTIME_DATABASE_URL: postgres://app_runtime@127.0.0.1:5432/sitolo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: install emitter and the action's exact cargo-deny
        run: |
          cat > /tmp/emit.py << 'PY'
          import sys
          name, path, rc = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(path, errors="replace").read()
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          if rc == "0":
              print(f"::notice title={name}::PASS (exit 0)")
              sys.exit(0)
          fi = text.find("\nfailures:\n")
          if fi >= 0:
              summary = "\n".join(l for l in text.splitlines() if l.startswith("test ") and not l.endswith("... ok"))
              text = "NON-OK TEST LINES:\n" + summary + "\n\n" + text[fi:]
              start = 0
          else:
              idxs = [i for i in (text.find("error["), text.find("error:"), text.find("panicked"), text.find("Diff in")) if i >= 0]
              start = min(idxs) if idxs else max(0, len(text) - 9000)
          body = text[start:start + 9000]
          chunks = [body[k:k + 3000] for k in range(0, len(body), 3000)][:3]
          for n, c in enumerate(chunks, 1):
              print(f"::error title={name} exit {rc} part {n}::{esc(c)}")
          print(f"::error title={name} tail::{esc(text[-1500:])}")
          PY
          curl -sSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp --strip-components=1
          /tmp/cargo-deny --version
      - name: deny advisories
        run: |
          set +e; /tmp/cargo-deny --color never --all-features --manifest-path ./Cargo.toml check advisories > d-adv.log 2>&1; rc=$?
          python3 /tmp/emit.py deny-advisories d-adv.log $rc; exit 0
      - name: deny bans
        run: |
          set +e; /tmp/cargo-deny --color never --all-features --manifest-path ./Cargo.toml check bans > d-bans.log 2>&1; rc=$?
          python3 /tmp/emit.py deny-bans d-bans.log $rc; exit 0
      - name: deny licenses
        run: |
          set +e; /tmp/cargo-deny --color never --all-features --manifest-path ./Cargo.toml check licenses > d-lic.log 2>&1; rc=$?
          python3 /tmp/emit.py deny-licenses d-lic.log $rc; exit 0
      - name: deny sources
        run: |
          set +e; /tmp/cargo-deny --color never --all-features --manifest-path ./Cargo.toml check sources > d-src.log 2>&1; rc=$?
          python3 /tmp/emit.py deny-sources d-src.log $rc; exit 0
      - name: fmt
        run: |
          set +e; cargo fmt --all -- --check > fmt.log 2>&1; rc=$?
          python3 /tmp/emit.py fmt fmt.log $rc; exit 0
      - name: clippy
        run: |
          set +e; cargo clippy --workspace --all-targets --all-features --locked -- -D warnings > clippy.log 2>&1; rc=$?
          python3 /tmp/emit.py clippy clippy.log $rc; exit 0
      - name: test workspace (as verify runs it, with the database)
        run: |
          set +e; cargo test --workspace --all-targets --all-features --locked > test.log 2>&1; rc=$?
          python3 /tmp/emit.py test-workspace test.log $rc; exit 0
      - name: rls suite
        run: |
          set +e; cargo test -p sitolo-persistence --test rls_security_tests --all-features --locked > rls.log 2>&1; rc=$?
          python3 /tmp/emit.py rls rls.log $rc; exit 0
      - name: release build
        run: |
          set +e; cargo build --workspace --release --locked > rel.log 2>&1; rc=$?
          python3 /tmp/emit.py release-build rel.log $rc; exit 0
