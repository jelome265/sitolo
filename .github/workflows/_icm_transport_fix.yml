name: _icm-transport-fix

on:
  push:
    branches: [feat/threat-model-axum-reconciliation-20260926]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix(api): remove unsupported TcpStream keepalive call and format transport boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Remove unsupported TCP keepalive call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/serve.rs')
          s = p.read_text()
          old = '''                if let Err(error) = stream.set_keepalive(Some(transport.keepalive_timeout)) {\n                    tracing::warn!(%error, ?peer, "failed to configure TCP keepalive");\n                }\n\n'''
          if old not in s:
              raise SystemExit('expected unsupported TcpStream::set_keepalive block not found')
          p.write_text(s.replace(old, ''))
          PY
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo 'No changes produced'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/serve.rs
          git commit -m 'fix(api): remove unsupported TcpStream keepalive call and format transport boundary'
          git push origin "HEAD:${GITHUB_REF_NAME}"
