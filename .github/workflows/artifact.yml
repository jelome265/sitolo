name: artifact

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# F-016: least privilege at workflow scope. Write authority lives only on
# the release job that publishes artifacts; verification is read-only.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sitolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Run canonical verification
        env:
          ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/sitolo_test
          RUNTIME_DATABASE_URL: postgres://app_runtime@127.0.0.1:5432/sitolo_test
        run: ./scripts/ci/verify

  build_release_artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Compute source identity once
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build the immutable release candidate
        run: cargo build --workspace --release --locked
      - name: Test the exact source identity
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Package and record release identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          source_sha="${SOURCE_SHA:?}"
          lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          toolchain="$(rustc --version)"
          tar -C target/release -czf releases/sitolo-${source_sha}.tar.gz sitolo-api sitolo-worker
          artifact_sha="$(sha256sum releases/sitolo-${source_sha}.tar.gz | awk '{print $1}')"
          cat > releases/release-metadata.json <<EOF
          {"source_sha":"${source_sha}","artifact":"sitolo-${source_sha}.tar.gz","artifact_sha256":"${artifact_sha}","cargo_lock_sha256":"${lock_sha}","toolchain":"${toolchain}","target":"x86_64-unknown-linux-gnu"}
          EOF
          sha256sum releases/sitolo-${source_sha}.tar.gz > releases/SHA256SUMS
      - name: Create release record before SBOM publication
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes releases/sitolo-${{ env.SOURCE_SHA }}.tar.gz releases/release-metadata.json releases/SHA256SUMS
      - name: Generate SPDX SBOM bound to the packaged artifact
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          file: releases/sitolo-${{ env.SOURCE_SHA }}.tar.gz
          format: spdx-json
      - name: Attest the packaged artifact provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: releases/sitolo-${{ env.SOURCE_SHA }}.tar.gz
      - name: Retain artifact identity and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sitolo-release-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          path: releases/
