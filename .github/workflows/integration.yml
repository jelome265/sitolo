name: integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application_contracts_with_postgres:
    name: application and contract tests with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sitolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy
      - name: Run boundary and contract tests
        env:
          ADMIN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/sitolo_test
          RUNTIME_DATABASE_URL: postgres://app_runtime@127.0.0.1:5432/sitolo_test
          WORKER_DATABASE_URL: postgres://app_worker@127.0.0.1:5432/sitolo_test
        run: cargo test --workspace --all-targets --all-features --locked --exclude sitolo-persistence
      # F-018 scope-exception governance. This textual record is backed by
      # docs/testing_strategy.md ("PostgreSQL integration exception
      # SCOPE-EXC-001"), which names the owner, scope, review date, and the
      # Phase 5 completion gate that retires it.
      - name: Record explicit Phase 1 exclusion
        run: >-
          echo "SCOPE-EXC-001 active: PostgreSQL integration harness deferred to Phase 5 (owner: platform; review: 2026-12-01; see docs/testing_strategy.md)."
