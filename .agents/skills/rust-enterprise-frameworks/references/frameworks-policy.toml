# Approved framework policy — enforced by scripts/check_frameworks.py in the gate.
#
# Values were taken from crates.io on 13 October 2026 (max stable version) and from the
# rust-version field of each downloaded crate. Re-verify when bumping. A version floor
# is the minimum acceptable version; `major` is the only accepted major series.
#
# Rule: EVERY version of an approved crate in Cargo.lock (including transitive ones) must satisfy
#       floor and major/minor. A transitive hyper 0.14 therefore fails the hyper entry.
#       A crate listed in [banned] must not appear in Cargo.lock at all.
#       Framework crates must appear at most once in Cargo.lock (no duplicate majors/minors).

[repo]
# The highest MSRV among approved frameworks sets the floor for the repository.
# sqlx 0.9.0 declares rust-version 1.94.0; that is the binding constraint today.
min_rust_version = "1.94.0"

# ----- Async runtime and transport ------------------------------------------------
[[approved]]
crate = "tokio"
area = "async runtime"
major = 1
floor = "1.53.2"
msrv = "1.71"
rules = ["FW-TOK"]

[[approved]]
crate = "axum"
area = "HTTP server"
major = 0
minor = 8                 # 0.x crates: the minor is the compatibility boundary
floor = "0.8.9"
msrv = "1.80"
rules = ["FW-AXM"]

[[approved]]
crate = "axum-core"
area = "axum extractor core (paired with axum)"
major = 0
minor = 5
floor = "0.5.6"
msrv = "1.80"
rules = ["FW-AXM"]

[[approved]]
crate = "tower"
area = "middleware and service abstraction"
major = 0
minor = 5
floor = "0.5.3"
msrv = "1.64"
rules = ["FW-TWR"]

[[approved]]
crate = "tower-http"
area = "HTTP middleware (timeouts, body limits, CORS, tracing)"
major = 0
minor = 7
floor = "0.7.1"
msrv = "1.65"
rules = ["FW-TWR", "FW-AXM"]

[[approved]]
crate = "hyper"
area = "HTTP protocol implementation"
major = 1
floor = "1.12.0"
msrv = "1.63"
rules = ["FW-HYP"]

[[approved]]
crate = "tonic"
area = "gRPC"
major = 0
minor = 14
floor = "0.14.6"
msrv = "1.88"
rules = ["FW-TNC"]

[[approved]]
crate = "prost"
area = "protobuf codegen (paired with tonic)"
major = 0
minor = 14
floor = "0.14.4"
msrv = "1.82"
rules = ["FW-TNC"]

# ----- Data -----------------------------------------------------------------------
[[approved]]
crate = "sqlx"
area = "async SQL access"
major = 0
minor = 9
floor = "0.9.0"
msrv = "1.94.0"
rules = ["FW-SQX"]

# ----- Outbound HTTP and TLS ------------------------------------------------------
[[approved]]
crate = "reqwest"
area = "outbound HTTP client"
major = 0
minor = 13
floor = "0.13.5"
msrv = "1.85.0"
rules = ["FW-RQW"]

[[approved]]
crate = "rustls"
area = "TLS"
major = 0
minor = 23
floor = "0.23.45"
msrv = "1.71"
rules = ["FW-RLS"]

# ----- Serialisation, config, observability ---------------------------------------
[[approved]]
crate = "serde"
area = "serialisation"
major = 1
floor = "1.0.229"
msrv = "1.56"
rules = ["FW-SRD"]

[[approved]]
crate = "serde_json"
area = "JSON (serde)"
major = 1
floor = "1.0.154"
msrv = "1.56"
rules = ["FW-SRD"]

[[approved]]
crate = "clap"
area = "CLI and configuration parsing"
major = 4
floor = "4.6.7"
msrv = "1.85"
rules = ["FW-CLP"]

[[approved]]
crate = "tracing"
area = "structured logging and spans"
major = 0
minor = 1
floor = "0.1.44"
msrv = "1.65"
rules = ["FW-TRC"]

[[approved]]
crate = "tracing-opentelemetry"
area = "tracing to OpenTelemetry bridge"
major = 0
minor = 34
floor = "0.34.0"
msrv = "1.75"
# Must be paired with the OpenTelemetry series below (tracing-opentelemetry 0.34 depends on opentelemetry 0.33).
rules = ["FW-OTL"]

[[approved]]
crate = "opentelemetry"
area = "OpenTelemetry API (paired with tracing-opentelemetry 0.34)"
major = 0
minor = 33
floor = "0.33.1"
msrv = "1.75"
rules = ["FW-OTL"]

[[approved]]
crate = "opentelemetry_sdk"
area = "OpenTelemetry SDK (paired with tracing-opentelemetry 0.34)"
major = 0
minor = 33
floor = "0.33.1"
msrv = "1.75"
rules = ["FW-OTL"]

# ----- Frameworks not approved --------------------------------------------------
# Adding any of these requires an ADR that names the owner, the reason the approved
# stack cannot serve the need, and the migration cost. The gate fails on presence.
[banned]
crates = [
  { name = "actix-web", reason = "not in approved HTTP stack (axum + tower + hyper); ADR required" },
  { name = "actix-rt",  reason = "second async runtime; violates single-runtime rule (FW-TOK-05)" },
  { name = "rocket",    reason = "not in approved HTTP stack; ADR required" },
  { name = "warp",      reason = "not in approved HTTP stack; ADR required" },
  { name = "diesel",    reason = "not in approved data stack (sqlx); ADR required" },
  { name = "sea-orm",   reason = "not in approved data stack (sqlx); ADR required" },
  { name = "async-std", reason = "second async runtime; violates single-runtime rule (FW-TOK-05)" },
  { name = "native-tls", reason = "system TLS stack; approved TLS is rustls (FW-RLS-01)" },
  { name = "openssl",    reason = "C TLS/crypto dependency; approved TLS is rustls (FW-RLS-01)" },
  { name = "openssl-sys", reason = "C TLS/crypto dependency; approved TLS is rustls (FW-RLS-01)" },
]
