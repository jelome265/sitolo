# clippy.library.toml — copy to a LIBRARY crate directory as clippy.toml.
# Clippy honours the nearest clippy.toml, so a library crate can carry stricter bans
# than the workspace. Verified: a per-crate clippy.toml is applied to that crate.
#
# Libraries must not decide runtime, configuration, or TLS policy for their callers.

disallowed-methods = [
  { path = "std::thread::sleep", reason = "FW-TOK-02: libraries must not block" },
  { path = "tokio::spawn", reason = "FW-TOK-03: libraries must not spawn detached tasks; return futures or accept a spawner" },
  { path = "tokio::runtime::Runtime::block_on", reason = "FW-TOK-04: libraries must never create or block on a runtime" },
  { path = "std::env::var", reason = "FW-CLP-02: libraries receive configuration as values, never from the environment" },
  { path = "std::env::var_os", reason = "FW-CLP-02: libraries receive configuration as values, never from the environment" },
  { path = "std::process::exit", reason = "BP-PN-01: libraries never terminate the process" },
  { path = "reqwest::Client::new", reason = "FW-RQW-01: libraries accept a configured client, they do not build one" },
  { path = "reqwest::Client::builder", reason = "FW-RQW-01: libraries accept a configured client, they do not build one" },
  { path = "clap::Parser::parse", reason = "FW-CLP-01: libraries never parse process arguments" },
  { path = "serde_json::de::Deserializer::disable_recursion_limit", reason = "FW-SRD-03" },
]

disallowed-types = [
  { path = "reqwest::blocking::Client", reason = "FW-RQW-02: libraries must not expose or use blocking clients" },
]
