# clippy.service.toml — copy to the WORKSPACE ROOT as clippy.toml (service and binary crates).
# Each entry is a framework-level hard ban. Enforcement: workspace lints set
# disallowed_methods = "deny" and disallowed_types = "deny" (lints-workspace.toml).
#
# Scoped exceptions use #[allow(clippy::disallowed_methods, reason = "...")] on the
# smallest item that needs it (on Rust 1.81+ prefer #[expect(...)]). Verified: an allow on
# the entry point suppresses only that expansion, and an allow on a helper does not
# suppress unrelated calls.
#
# Every path below was verified against the downloaded crate source or a path-equivalent
# stub (see README "Verification performed"). Re-run the framework gate after any bump.

disallowed-methods = [
  # ---- Async runtime (FW-TOK) ----
  { path = "std::thread::sleep", reason = "FW-TOK-02 / BP-AS-01: blocks the async runtime; use tokio::time::sleep" },
  { path = "tokio::spawn", reason = "FW-TOK-03 / BP-AS-04: fire-and-forget task; spawn through an owned JoinSet" },
  { path = "tokio::runtime::Runtime::block_on", reason = "FW-TOK-04: only the binary entry point may block on a runtime; #[tokio::main] needs a scoped allow" },

  # ---- Outbound HTTP (FW-RQW) ----
  { path = "reqwest::Client::new", reason = "FW-RQW-01 / SEC-TLS-04: clients without explicit timeouts are forbidden; build via the policy builder" },
  { path = "reqwest::Client::builder", reason = "FW-RQW-01: the policy builder in the http_client module is the only sanctioned constructor" },

  # ---- HTTP routing (FW-AXM) ----
  { path = "axum::Router::route", reason = "FW-AXM-01: routes must be registered through the inventory registry (permission and body limit required)" },

  # ---- Middleware (FW-TWR) ----
  { path = "tower_http::timeout::TimeoutLayer::new", reason = "FW-TWR-01: deprecated in tower-http 0.7; use TimeoutLayer::with_status_code" },

  # ---- Configuration (FW-CLP, IMP-6.1) ----
  { path = "clap::Parser::parse", reason = "FW-CLP-01: parse() exits the process on error; use try_parse() and map the error" },
  { path = "clap::Command::get_matches", reason = "FW-CLP-01: get_matches() exits the process on error; use try_get_matches()" },
  { path = "std::env::var", reason = "FW-CLP-02 / IMP-6.1: environment is read once at the binary boundary through clap" },
  { path = "std::env::var_os", reason = "FW-CLP-02 / IMP-6.1: environment is read once at the binary boundary through clap" },

  # ---- Serialisation limits (FW-SRD) ----
  { path = "serde_json::de::Deserializer::disable_recursion_limit", reason = "FW-SRD-03 / SEC-IN-03: recursion limit must not be disabled" },

  # ---- TLS (FW-RLS) ----
  { path = "rustls::ClientConfig::dangerous", reason = "FW-RLS-02 / SEC-TLS-03: certificate verification must not be customised" },
  { path = "rustls::client::danger::DangerousClientConfig::set_certificate_verifier", reason = "FW-RLS-02 / SEC-TLS-03" },
]

disallowed-types = [
  # ---- Blocking HTTP in async services (FW-RQW-02) ----
  { path = "reqwest::blocking::Client", reason = "FW-RQW-02 / BP-AS-01: blocking client in an async service blocks the runtime" },
]
