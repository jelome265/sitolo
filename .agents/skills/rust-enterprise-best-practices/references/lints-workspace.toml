# Authoritative enterprise workspace lint policy.
# Place in the ROOT Cargo.toml of every Rust workspace. Member crates opt in with:
#
#   [lints]
#   workspace = true
#
# Priority -1 on group entries lets individual lints below override the group.
# Lint names were checked against stable rustc/clippy. Verify with the pinned
# toolchain in CI: unknown lint names are warnings, and a warning-free gate
# depends on -D warnings. Re-run `cargo clippy -- -D warnings` after any edit.

[workspace.lints.rust]
# --- Memory safety and unsafe (BP-US, BP-LN-02) ---
unsafe_code = "forbid"                       # relax per crate only with an exception record (FFI crates)
unsafe_op_in_unsafe_fn = "deny"              # edition 2024 default is warn; enterprise requires deny
# --- Hygiene ---
unused_must_use = "deny"                     # BP-TY-10
missing_debug_implementations = "warn"       # BP-TY-09 support; secret types are handled explicitly
missing_docs = "warn"                        # BP-DC-01; libraries escalate to "deny" in their own Cargo.toml
unreachable_pub = "warn"                     # BP-MO-01
unused_qualifications = "warn"               # BP-MA-02
unused_lifetimes = "warn"
trivial_casts = "warn"                       # BP-NU-01 support
trivial_numeric_casts = "warn"               # BP-NU-01 support
let_underscore_drop = "warn"                 # BP-ER-01 support
non_ascii_idents = "deny"                    # homoglyph and spoofing defence in identifiers
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# --- Groups (BP-LN-06) ---
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# nursery is intentionally not enabled wholesale; enable individual lints per project ADR.

# --- Framework hard bans from clippy.toml (FW-LN-01; rules in rust-enterprise-frameworks) ---
disallowed_methods = "deny"
disallowed_types = "deny"

# --- Panic-freedom and error discipline (BP-ER-02, BP-PN-01/02, BP-ER-06) ---
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
unwrap_in_result = "deny"
exit = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
let_underscore_untyped = "deny"

# --- Output discipline (BP-OB-01) ---
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# --- Indexing, casts, arithmetic, strings (BP-CO-01/06, BP-NU-01/02/04) ---
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
cast_lossless = "warn"
arithmetic_side_effects = "deny"
float_cmp = "deny"
float_cmp_const = "deny"

# --- Unsafe and memory (BP-US-02/03/08) ---
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
mem_replace_with_uninit = "deny"
uninit_vec = "deny"

# --- Concurrency and async (BP-CC-02, BP-AS-04) ---
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
rc_mutex = "deny"

# --- Types and API (BP-TY-06, BP-TY-10, BP-DC-01) ---
wildcard_enum_match_arm = "deny"
must_use_candidate = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "deny"

# --- Ownership and allocation (BP-OW-02) ---
clone_on_ref_ptr = "deny"
redundant_clone = "warn"
needless_collect = "deny"
needless_pass_by_value = "warn"

# --- Suppression discipline (BP-LN-04/05) ---
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# --- Pedantic lints that are noisy for enterprise code: documented, not silent ---
module_name_repetitions = "allow"            # reason: names chosen for domain clarity; reviewed manually
similar_names = "allow"                      # reason: noisy; BP-FM-03 covers naming quality in review
