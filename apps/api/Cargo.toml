[package]
name = "sitolo-api-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sitolo HTTP API runtime composition root."
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sitolo-api"
path = "src/main.rs"
# Binaries are release artifacts, not API documentation: excluding the bin
# target keeps `cargo doc` on the library and avoids the lib/bin output
# filename collision (both would emit `sitolo_api/index.html`).
doc = false

[lib]
name = "sitolo_api_bin"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sitolo-api = { path = "../../crates/sitolo-api" }
sitolo-auth.workspace = true
sitolo-application = { path = "../../crates/sitolo-application" }
sitolo-config.workspace = true
sitolo-domain = { path = "../../crates/sitolo-domain" }
sitolo-integrations = { path = "../../crates/sitolo-integrations" }
sitolo-observability.workspace = true
sitolo-persistence = { path = "../../crates/sitolo-persistence" }
sitolo-security.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
sitolo-testkit = { path = "../../crates/sitolo-testkit" }
sqlx-core.workspace = true
sqlx-postgres.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
