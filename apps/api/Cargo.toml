[package]
name = "sitolo-api-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sitolo-api"
path = "src/main.rs"
# Binaries are release artifacts, not API documentation: excluding the bin
# target keeps `cargo doc` on the library and avoids the lib/bin output
# filename collision (both would emit `sitolo_api/index.html`).
doc = false

[lib]
name = "sitolo_api_bin"
path = "src/lib.rs"

[dependencies]
sitolo-config.workspace = true
sitolo-observability.workspace = true
sitolo-security.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true