[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    # Permissive ISC license required by `untrusted` in the AWS-LC/rustls tree.
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # SQLx 0.9 uses Mozilla webpki roots with rustls aws-lc-rs.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"

# FW-SRD-03 / SEC-IN-03: `unbounded_depth` exposes
# `Deserializer::disable_recursion_limit`, which removes the JSON nesting bound.
# The Clippy path ban cannot express this because the method is unreachable
# without the feature, so the feature itself is denied here.
[[bans.features]]
crate = "serde_json"
deny = ["unbounded_depth"]

[sources]
allow-git = []
